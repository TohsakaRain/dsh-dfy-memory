# ============================================================================
# dsh-dfy-memory —— 人格数据层插件
# ============================================================================
# 加载时做两件事：
#   1) 注册 41 个 dfy_* 工具（长期记忆 / 心情·好感 / 承诺 / 日记 / 对话窗口 / 作品库 / 邮箱）
#   2) 挂上只读 HTTP 端点 /api/dfy-memory/*（设置页和宿主都从这儿取）
#
# 它**不往任何 prompt 里注入东西**：注入是宿主的事，宿主通过
#   GET /api/dfy-memory/prompt-block  或  facade.memory.forPrompt()  拿文本。
# （可选的自注入默认关；打开后由插件自己拼，见下面 selfInject）
#
# 数据默认在 ~/.dsh/dsh-dfy-memory/（memory/ diary/ state/ works/ mailbox/ context/ archive/）
# ============================================================================
- insert:
    - id: dfy-memory
      name: dsh-dfy-memory
      config:
        # 默认数据目录：~/.dsh/dsh-dfy-memory/（跟第三方 DSH 插件一致，落在用户目录下）
        #   memory/ diary/ state/ works/ mailbox/ context/
        # 一般**不用改这里**。要换地方，两种办法（二选一）：
        #   1) 环境变量 DFY_DATA_DIR=D:\my\dsh-data
        #   2) 取消下面注释，写绝对路径
        # memoryDir: 'D:/my/dsh-data/memory'
        # diaryDir:  'D:/my/dsh-data/diary'
        # stateDir:  'D:/my/dsh-data/state'
        # worksDir:  'D:/my/dsh-data/works'
        enabled: true

        # 自注入（默认关）：开了之后插件自己把记忆块挂进 system prompt 末尾。
        # 不填这一段 = 关闭，注入归宿主（宿主自己取 GET /api/dfy-memory/prompt-block）。
        # selfInject:
        #   enabled: true
        #   order: 10150                 # 排在 first-party 段之后
        #   refreshMs: 60000             # 兜底刷新间隔（平时按「来新消息」刷新）
        #   presets: ['qq-chat', 'qq-chat-v2']   # 只给这些会话注入；空 = 全部会话
        #   cwdContains: ['qq-bridge']   # 或者按会话工作目录匹配；空 = 不按目录筛
